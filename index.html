<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Church of Our Saviour – Slides</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity 1s ease;
  }
  .layer.show { opacity: 1; }
  #msg {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ddd; font: 28px/1.4 Georgia, serif; text-align: center; padding: 2rem;
  }
  @media (prefers-reduced-motion: reduce) { .layer { transition: none; } }
</style>
</head>
<body>
<img id="a" class="layer" alt="">
<img id="b" class="layer" alt="">
<div id="msg">No slides found.<br>Upload slide1.jpg, slide2.jpg, … to the images folder.</div>

<script>
// ---------- Settings you can change ----------
const SECONDS_PER_SLIDE = 10;     // how long each slide shows
const CHECK_FOR_NEW_MINUTES = 5;  // how often to look for updated slides
const FOLDER = "images/";         // folder holding the slides
const PREFIX = "image";           // slide1.jpg, slide2.jpg, ...
const EXT = ".jpg";
const MAX_SLIDES = 60;            // safety limit
// ---------------------------------------------

const layers = [document.getElementById("a"), document.getElementById("b")];
const msg = document.getElementById("msg");
let slides = [];      // array of URLs currently in rotation
let index = -1;
let front = 0;
let timer = null;

function load(url) {
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve(true);
    im.onerror = () => resolve(false);
    im.src = url;
  });
}

// Finds slide1, slide2, ... until one is missing. Stamp defeats old cached copies.
async function findSlides() {
  const stamp = Date.now();
  const found = [];
  for (let n = 1; n <= MAX_SLIDES; n++) {
    const url = FOLDER + PREFIX + n + EXT + "?v=" + stamp;
    if (await load(url)) found.push(url); else break;
  }
  return found;
}

function show(url) {
  const next = 1 - front;
  layers[next].src = url;
  layers[next].classList.add("show");
  layers[front].classList.remove("show");
  front = next;
}

function advance() {
  if (!slides.length) return;
  index = (index + 1) % slides.length;
  show(slides[index]);
}

function start() {
  clearInterval(timer);
  msg.style.display = slides.length ? "none" : "flex";
  if (!slides.length) return;
  index = -1;
  advance();
  timer = setInterval(advance, SECONDS_PER_SLIDE * 1000);
}

async function refresh() {
  try {
    const found = await findSlides();
    // Keep what's on screen if the network hiccups and nothing is found.
    if (!found.length && slides.length) return;
    slides = found;
    start();
  } catch (e) { /* keep current slides */ }
}

refresh();
setInterval(refresh, CHECK_FOR_NEW_MINUTES * 60 * 1000);
</script>
</body>
</html>
